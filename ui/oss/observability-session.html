<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/observability-session-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <observability-session-page data-page>
      <!-- Mirrors the loaded page: back button + title with the id chip, the
           chip-form KPI strip, the turn strip, then two panes (traces | span
           detail). -->
      <div class="pre-modnav"></div>
      <div style="display:flex;align-items:center;gap:var(--s-16);margin-bottom:var(--s-24);">
        <div class="skel-block" style="width:36px;height:36px;border-radius:var(--r-8);"></div>
        <div class="skel-card__line" style="height:28px;width:340px;max-width:50vw;"></div>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:var(--s-8);margin-bottom:var(--s-24);">
        <div class="skel-block" style="width:150px;height:26px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="width:140px;height:26px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="width:148px;height:26px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="width:136px;height:26px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="width:130px;height:26px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="width:138px;height:26px;border-radius:var(--r-8);"></div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:var(--s-16);margin-bottom:var(--s-16);">
        <div style="display:flex;flex-direction:column;gap:var(--s-8);">
          <div class="skel-block" style="width:32px;height:32px;border-radius:var(--r-8);"></div>
          <div class="skel-block" style="width:32px;height:32px;border-radius:var(--r-8);"></div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;gap:var(--s-8);">
          <div class="skel-card__line" style="width:62%;"></div>
          <div class="skel-card__line" style="width:88%;"></div>
          <div class="skel-card__line" style="width:44%;"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(280px,4fr) minmax(340px,5fr);gap:var(--s-16);">
        <div class="skel-block" style="height:480px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:480px;border-radius:var(--r-8);"></div>
      </div>
    </observability-session-page>
  </body>
</html>
