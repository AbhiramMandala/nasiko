<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko — Session Trace</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <!--
      Retired page, kept as a redirect stub so existing links and bookmarks
      (?trace_id=…) keep working. The trace-scoped flat span list this used to
      render showed strictly less than the Observability session view — no span
      detail, no attributes, no transcript — for the same data. The stub
      resolves trace → session via the trace payload's `project_session_id`
      and hands off to /observability-session.html with the trace preselected.
    -->
    <script type="module" src="/common/pages/session-trace-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <session-trace-page data-page>
      <!-- Interstitial only: this page redirects as soon as the trace resolves. -->
      <div style="display:flex;align-items:center;gap:var(--s-16);padding-bottom:var(--s-16);border-bottom:1px solid var(--color-border);margin-bottom:var(--s-16);">
        <div class="skel-card__btn" style="width:90px;height:36px;"></div>
        <div class="skel-card__line" style="height:24px;width:420px;max-width:50vw;"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--s-12);">
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
        <div class="skel-block" style="height:52px;border-radius:var(--r-8);"></div>
      </div>
    </session-trace-page>
  </body>
</html>
