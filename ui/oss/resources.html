<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko — Resources</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/design-system/app-loading-bar/app-loading-bar.js"></script>
    <script type="module" src="/common/features/app-module-nav.js"></script>
    <script type="module" src="/common/pages/resources-page.js"></script>
  </head>
  <body>
    <app-loading-bar></app-loading-bar>
    <app-header></app-header>
    <resources-page data-page>
      <!-- Secondary-rail placeholder. Reserves the module nav's slot before the
           component injects the real `<app-module-nav>`: the shell slot is keyed on
           this class at first paint (styles/page-layout.css) and it reserves the
           disclosure bar below 1024px (styles/not-defined.css). -->
      <div class="pre-modnav"></div>
      <!-- Mirrors the loaded page: title + meta, KPI strip, then the three
           group cards. Keep in step with resources-page.css or first paint jumps. -->
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-16);margin-bottom:var(--s-24);">
        <div>
          <div class="skel-card__line" style="height:28px;width:180px;"></div>
          <div class="skel-card__line" style="width:420px;max-width:60vw;margin-top:var(--s-4);"></div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);padding:var(--s-16) 0;margin-bottom:var(--s-24);gap:var(--s-16);">
        <div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="width:80px;"></div><div class="skel-card__line" style="height:20px;width:110px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="width:80px;"></div><div class="skel-card__line" style="height:20px;width:110px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="width:80px;"></div><div class="skel-card__line" style="height:20px;width:110px;"></div></div>
        <div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="width:80px;"></div><div class="skel-card__line" style="height:20px;width:110px;"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:var(--s-16);">
        <div class="skel-block" style="height:180px;border-radius:var(--r-12);"></div>
        <div class="skel-block" style="height:240px;border-radius:var(--r-12);"></div>
        <div class="skel-block" style="height:220px;border-radius:var(--r-12);"></div>
      </div>
    </resources-page>
  </body>
</html>
