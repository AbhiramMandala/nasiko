<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/design-system/app-badge/app-badge.js"></script>
    <script type="module" src="/common/design-system/app-skeleton/app-skeleton.js"></script>
    <script type="module" src="/common/design-system/app-empty-state/app-empty-state.js"></script>
    <script type="module" src="/common/pages/mcp-detail-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <mcp-detail-page>
      <div style="display:flex;align-items:center;gap:var(--s-12);margin-bottom:var(--s-24);">
        <div class="skel-block" style="width:36px;height:36px;border-radius:var(--r-8);"></div>
        <div class="skel-card__line" style="height:28px;width:200px;"></div>
      </div>
      <div class="skel-card__line" style="width:60%;max-width:600px;margin-bottom:var(--s-16);"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s-16);margin-bottom:var(--s-32);">
        <div class="skel-card__line" style="height:20px;"></div>
        <div class="skel-card__line" style="height:20px;"></div>
        <div class="skel-card__line" style="height:20px;"></div>
        <div class="skel-card__line" style="height:20px;"></div>
      </div>
      <div class="skel-card__line" style="height:22px;width:100px;margin-bottom:var(--s-16);"></div>
      <div class="skel-grid">
        <div class="skel-card"></div>
        <div class="skel-card"></div>
        <div class="skel-card"></div>
      </div>
    </mcp-detail-page>
  </body>
</html>
