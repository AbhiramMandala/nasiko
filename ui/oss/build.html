<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: both theme.js and app-header.js are deferred ES modules, so they apply the stored theme / rail width only after first paint —
         the skeleton would flash the OS theme, and an expanded rail would collapse and re-expand on every MPA navigation. Must stay inline and non-module. -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded-v2')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/build-detail-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <build-detail-page>
      <!-- Title + back link, id line, 4-cell KPI strip, details well, log. -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-16);">
        <div style="display:flex;flex-direction:column;gap:var(--s-8);">
          <div class="skel-card__line" style="height:28px;width:210px;"></div>
          <div class="skel-card__line" style="width:300px;max-width:50vw;"></div>
        </div>
        <div class="skel-card__line" style="width:130px;"></div>
      </div>
      <div style="display:flex;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin:var(--s-24) 0;">
        <div style="flex:1;padding:var(--s-16) var(--s-16) var(--s-16) 0;display:flex;flex-direction:column;gap:var(--s-12);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:22px;width:120px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-12);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:22px;width:120px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-12);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:22px;width:160px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-12);"><div class="skel-card__line" style="width:70px;"></div><div class="skel-card__line" style="height:22px;width:160px;"></div></div>
      </div>
      <div class="skel-card__line" style="height:22px;width:80px;margin-bottom:var(--s-16);"></div>
      <div class="skel-block" style="height:250px;border-radius:var(--r-8);margin-bottom:var(--s-24);"></div>
      <div class="skel-card__line" style="height:22px;width:100px;margin-bottom:var(--s-16);"></div>
      <div class="skel-block" style="height:120px;border-radius:var(--r-8);"></div>
    </build-detail-page>
  </body>
</html>
