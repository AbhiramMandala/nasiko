<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <!-- The page component's own sheet, linked rather than imported by its
         module, so the static shell below is fully styled at first paint.
         agents-page.js must therefore NOT also adopt it. -->
    <link rel="stylesheet" href="/common/pages/agents-page.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/agents-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <agents-page>
      <!-- Secondary-rail placeholder. Reserves the module nav's slot before the
           component injects the real `<app-module-nav>`: the shell slot is keyed on
           this class at first paint (styles/page-layout.css) and it reserves the
           disclosure bar below 1024px (styles/not-defined.css). -->
      <div class="pre-modnav"></div>
      <!-- Static shell: everything that needs no backend, in the component's
           own class names so it paints for real before the module loads. The
           component binds to these nodes instead of re-rendering them, and
           fills only the two API-fed regions (#category-tabs, #agents-grid),
           which start as the same skeletons the component would draw. -->
      <app-module-nav module="agents"></app-module-nav>
      <div class="page-top">
        <h1 class="title-page">Agent hub</h1>
        <!-- Deliberately count-free: the fleet size lands in the "All N" tab.
             Injecting it here reflowed the description (2 → 3 lines on mobile)
             the moment the API answered. -->
        <p class="subtitle">Discover and chat with the agents deployed on this cluster.</p>
      </div>
      <div class="controls">
        <app-search id="search-input" class="search-wrap" size="md"
            placeholder="Search agents by name, skill, or capability"
            aria-label="Search agents"></app-search>
      </div>
      <app-tabs strip id="category-tabs">
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
      </app-tabs>
      <div class="grid" id="agents-grid">
        <app-card loading></app-card>
        <app-card loading></app-card>
        <app-card loading></app-card>
        <app-card loading></app-card>
        <app-card loading></app-card>
        <app-card loading></app-card>
      </div>
    </agents-page>
  </body>
</html>
