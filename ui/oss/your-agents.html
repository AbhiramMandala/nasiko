<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <!-- The page component's own sheet, linked rather than imported by its
         module, so the static shell below is fully styled at first paint.
         your-agents-page.js must therefore NOT also adopt it. -->
    <link rel="stylesheet" href="/common/pages/your-agents-page.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/your-agents-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <your-agents-page>
      <!-- Secondary-rail placeholder. Reserves the module nav's slot before the
           component injects the real `<app-module-nav>`: the shell slot is keyed on
           this class at first paint (styles/page-layout.css) and it reserves the
           disclosure bar below 1024px (styles/not-defined.css). -->
      <div class="pre-modnav"></div>
      <!-- Static shell: everything that needs no backend, in the component's
           own class names so it paints for real before the module loads. The
           component binds to these nodes instead of re-rendering them, and
           fills only the two API-fed regions (#status-tabs, #agents-grid),
           which start as the same skeletons the component would draw. -->
      <app-module-nav module="agents"></app-module-nav>
      <div class="page-header">
        <div class="page-header-top">
          <div>
            <h1 class="title-page">Your agents</h1>
            <p class="page-desc">Deployed agent containers you manage. Track status and failures, then open one to manage access, versions, and settings.</p>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="search-wrap">
          <span class="search-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px;flex-shrink:0"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
          <input type="search" id="search-input" placeholder="Search agents by name, skill, or capability..." />
          <button class="search-clear" id="search-clear" aria-label="Clear search" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;flex-shrink:0"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
        <div class="sort-wrap">
          <select id="sort-select" class="sort-select" aria-label="Sort agents">
            <option value="name">Sort: Name</option>
            <option value="status">Sort: Status</option>
            <option value="version">Sort: Version</option>
          </select>
        </div>
      </div>
      <div class="type-tabs" id="status-tabs" role="tablist">
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
        <div class="skel-tab"></div>
      </div>
      <div class="agents-grid" id="agents-grid">
        <div class="agent-card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc"></div>
          <div class="skel-line skel-line--desc2"></div>
          <div class="skel-actions"><div class="skel-btn"></div><div class="skel-btn"></div></div>
        </div>
        <div class="agent-card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc"></div>
          <div class="skel-line skel-line--desc2"></div>
          <div class="skel-actions"><div class="skel-btn"></div><div class="skel-btn"></div></div>
        </div>
        <div class="agent-card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc"></div>
          <div class="skel-line skel-line--desc2"></div>
          <div class="skel-actions"><div class="skel-btn"></div><div class="skel-btn"></div></div>
        </div>
        <div class="agent-card skeleton-card">
          <div class="skel-line skel-line--name"></div>
          <div class="skel-tags"><div class="skel-tag"></div><div class="skel-tag"></div></div>
          <div class="skel-line skel-line--desc"></div>
          <div class="skel-line skel-line--desc2"></div>
          <div class="skel-actions"><div class="skel-btn"></div><div class="skel-btn"></div></div>
        </div>
      </div>
    </your-agents-page>
  </body>
</html>
