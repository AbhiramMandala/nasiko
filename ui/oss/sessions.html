<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/design-system/app-empty-state/app-empty-state.js"></script>
    <script type="module" src="/common/pages/sessions-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <sessions-page data-page>
      <!-- Pre-upgrade paint: real header and filter field (neither needs a
           backend, and neither may move), shimmer only for the session rows.
           The component replaces all of this on upgrade — see
           common/styles/not-defined.css. -->
      <div class="pre-modnav"></div>
      <div class="pre-head pre-head--split" style="--pre-head-mb:var(--s-16);--pre-head-gap:var(--s-4);--pre-head-wrap:nowrap">
        <div>
          <h1 class="title-page">Session history</h1>
          <p>Review all queries across agents. Select a session to open its
            trace details.</p>
        </div>
        <div class="pre-head__actions">
          <span class="pre-action pre-action--solid">New Chat</span>
        </div>
      </div>
      <div class="pre-controls" style="--pre-controls-mb:var(--s-16)">
        <div class="pre-search" style="--pre-search-max:380px;--pre-search-pl:var(--s-32)">
          <span class="pre-search__icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px;flex-shrink:0"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
          <input class="pre-search__input" type="search" placeholder="Search sessions" aria-label="Search sessions" />
        </div>
        <span class="pre-action" style="margin-left:auto">Last 7 days</span>
      </div>
      <div class="pre-table" style="--pre-cols:32% 11% 11% 16% 19% 11%;--pre-table-head-bg:var(--bg-subtle)">
        <div class="pre-table__row pre-table__row--head" style="--pre-row-h:42px"></div>
        <div class="pre-table__row" style="--pre-row-h:64px">
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:40%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:55%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:45%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:80%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
        </div>
        <div class="pre-table__row" style="--pre-row-h:64px">
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:40%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:55%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:45%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:80%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
        </div>
        <div class="pre-table__row" style="--pre-row-h:64px">
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:40%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:55%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:45%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:80%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
        </div>
        <div class="pre-table__row" style="--pre-row-h:64px">
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:40%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:55%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:45%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:80%"></div></div>
          <div class="pre-td"><div class="pre-cell" style="width:70%"></div></div>
        </div>
      </div>
    </sessions-page>
  </body>
</html>
