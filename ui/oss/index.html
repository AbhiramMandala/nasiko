<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Inline and synchronous on purpose: restore theme + rail width before
         first paint so the skeleton doesn't flash the OS theme. Only runs once
         per session (SPA), not per navigation (MPA). -->
    <script>try{var t=localStorage.getItem('app-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('app-rail-expanded')==='true')document.documentElement.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <!-- Module execution order is guaranteed by document order:
         1. navigation.js — registers data functions + fetchNavigation/fetchModuleNav
         2. app-header.js — renders the persistent shell (imports bootstrap.js)
         3. app.js        — defines routes + starts the router -->
    <!-- Core systems — auto-inject CSS tokens + utilities on import -->
    <script type="module" src="/common/core/motion.js"></script>
    <script type="module" src="/common/core/responsive.js"></script>
    <script type="module" src="/common/design-system/app-tooltip/app-tooltip.js"></script>
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <app-splash></app-splash>
    <app-header hidden></app-header>
    <main id="outlet" hidden>
      <!-- The router mounts page components here. On initial load the outlet
           is empty — the page component's own connectedCallback renders its
           loading state (or the pre-upgrade skeleton CSS fills in). Subsequent
           client-side navigations swap the page element with a view transition. -->
    </main>
  </body>
</html>
