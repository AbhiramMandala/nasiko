<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko — Workflow runs</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/executions-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <executions-page data-page>
      <!-- Pre-upgrade paint: real header and controls (they need no backend and must
           not move), shimmer only for what the API feeds. The component replaces
           all of this on upgrade — see common/styles/not-defined.css. -->
      <div class="pre-modnav"></div>
      <div class="pre-head" style="--pre-head-gap:0">
        <h1 class="title-page">Workflow runs</h1>
      </div>
      <div class="pre-tabs" style="--pre-tabs-mb:var(--s-20)">
        <span class="pre-tab pre-tab--active">Active</span>
        <span class="pre-tab">History</span>
      </div>
      <div class="pre-controls" style="--pre-controls-mb:var(--s-24)">
        <div class="pre-search" style="--pre-search-max:280px;--pre-search-pl:34px">
          <span class="pre-search__icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px;flex-shrink:0"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></span>
          <input class="pre-search__input" type="search" placeholder="Search" aria-label="Search workflow runs" />
        </div>
        <select class="pre-select pre-select--chevron" aria-label="Filter by status"><option>All</option></select>
        <select class="pre-select pre-select--chevron" aria-label="Filter by age"><option>All</option></select>
      </div>
      <div class="pre-rows" style="--pre-gap:var(--s-16);--pre-card-h:108px;--pre-card-pad:var(--s-20);--pre-card-gap:var(--s-12)">
        <div class="pre-card">
          <div class="pre-line pre-line--name"></div>
          <div class="pre-tags"><div class="pre-tag"></div><div class="pre-tag"></div><div class="pre-tag"></div></div>
          <div class="pre-line" style="width:70%"></div>
        </div>
        <div class="pre-card">
          <div class="pre-line pre-line--name"></div>
          <div class="pre-tags"><div class="pre-tag"></div><div class="pre-tag"></div><div class="pre-tag"></div></div>
          <div class="pre-line" style="width:70%"></div>
        </div>
      </div>
    </executions-page>
  </body>
</html>
