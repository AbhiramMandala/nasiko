<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/tokenops-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <tokenops-page data-page>
      <!-- Mirrors the loaded page: head (title + export), filter bar, KPI strip
           (5 chip + value/label metrics), the two panels with their reserved
           plot boxes, and the attributions toolbar + table. -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s-16);margin-bottom:var(--s-16);">
        <div class="skel-card__line" style="height:28px;width:160px;"></div>
        <div class="skel-card__btn" style="width:130px;height:32px;"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s-16);padding-bottom:var(--s-16);border-bottom:1px dashed var(--color-border);margin-bottom:var(--s-8);">
        <div class="skel-card__btn" style="width:120px;height:32px;"></div>
        <div style="display:flex;gap:var(--s-8);">
          <div class="skel-card__btn" style="width:150px;height:32px;"></div>
          <div class="skel-card__btn" style="width:96px;height:32px;"></div>
          <div class="skel-card__btn" style="width:96px;height:32px;"></div>
          <div class="skel-card__btn" style="width:96px;height:32px;"></div>
        </div>
      </div>
      <!-- KPI strip: five chip + value/label metrics, no hairlines (the page
           builds these as plain divs, not <app-stat-row>). -->
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--s-16) var(--s-24);margin:var(--s-16) 0 var(--s-24);">
        <div style="display:flex;align-items:center;gap:var(--s-12);"><div class="skel-card__line" style="width:28px;height:26px;border-radius:var(--r-8);"></div><div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="height:24px;width:88px;"></div><div class="skel-card__line" style="width:70px;"></div></div></div>
        <div style="display:flex;align-items:center;gap:var(--s-12);"><div class="skel-card__line" style="width:28px;height:26px;border-radius:var(--r-8);"></div><div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="height:24px;width:88px;"></div><div class="skel-card__line" style="width:70px;"></div></div></div>
        <div style="display:flex;align-items:center;gap:var(--s-12);"><div class="skel-card__line" style="width:28px;height:26px;border-radius:var(--r-8);"></div><div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="height:24px;width:88px;"></div><div class="skel-card__line" style="width:70px;"></div></div></div>
        <div style="display:flex;align-items:center;gap:var(--s-12);"><div class="skel-card__line" style="width:28px;height:26px;border-radius:var(--r-8);"></div><div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="height:24px;width:88px;"></div><div class="skel-card__line" style="width:70px;"></div></div></div>
        <div style="display:flex;align-items:center;gap:var(--s-12);"><div class="skel-card__line" style="width:28px;height:26px;border-radius:var(--r-8);"></div><div style="display:flex;flex-direction:column;gap:var(--s-4);"><div class="skel-card__line" style="height:24px;width:88px;"></div><div class="skel-card__line" style="width:70px;"></div></div></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:var(--s-16);margin-bottom:var(--s-32);">
        <div class="skel-block" style="height:400px;border-radius:var(--r-12);"></div>
        <div class="skel-block" style="height:400px;border-radius:var(--r-12);"></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:var(--s-16);margin-bottom:var(--s-16);">
        <div class="skel-card__line" style="height:20px;width:120px;"></div>
        <div style="display:flex;gap:var(--s-12);">
          <div class="skel-card__btn" style="width:150px;height:32px;"></div>
          <div class="skel-card__btn" style="width:130px;height:32px;"></div>
        </div>
      </div>
      <div class="skel-block" style="height:220px;border-radius:var(--r-8);"></div>
    </tokenops-page>
  </body>
</html>
