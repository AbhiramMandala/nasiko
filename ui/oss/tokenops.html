<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/tokenops-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <tokenops-page>
      <!-- Mirrors the loaded page: head (title/sub + period select/export),
           KPI strip (hairline top/bottom, 4 columns), toolbar + cost table. -->
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-16);margin-bottom:var(--s-24);">
        <div style="display:flex;flex-direction:column;gap:var(--s-8);">
          <div class="skel-card__line" style="height:28px;width:160px;"></div>
          <div class="skel-card__line" style="width:380px;max-width:60vw;"></div>
        </div>
        <div style="display:flex;gap:var(--s-12);">
          <div class="skel-card__btn" style="width:120px;height:32px;"></div>
          <div class="skel-card__btn" style="width:90px;height:32px;"></div>
        </div>
      </div>
      <div style="display:flex;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);margin-bottom:var(--s-32);">
        <div style="flex:1;padding:var(--s-16) var(--s-16) var(--s-16) 0;display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
        <div style="flex:1;padding:var(--s-16);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:90px;"></div><div class="skel-card__line" style="height:24px;width:130px;"></div></div>
      </div>
      <div class="skel-card__line" style="height:20px;width:110px;margin-bottom:var(--s-16);"></div>
      <div style="display:flex;gap:var(--s-16);margin-bottom:var(--s-16);">
        <div class="skel-block" style="height:36px;width:340px;max-width:50vw;border-radius:var(--r-8);"></div>
        <div style="flex:1;"></div>
        <div class="skel-block" style="height:32px;width:130px;border-radius:var(--r-8);"></div>
      </div>
      <div class="skel-block" style="height:180px;border-radius:var(--r-8);"></div>
    </tokenops-page>
  </body>
</html>
