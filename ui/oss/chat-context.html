<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nasiko</title>
    <link rel="icon" type="image/svg+xml" href="/common/mark-nasiko.svg" />
    <!-- Generated by ui/scripts/gen-boot-inline.mjs — change the snippet there, not here.
         Inline and synchronous on purpose: the stored theme and both rail widths have to
         be on <html> before first paint. Every other script that could set them is a
         deferred module, so without this the shell paints in the OS theme with
         default-width rails and then jumps. -->
    <script>try{var d=document.documentElement,s=localStorage,t=s.getItem('app-theme');if(t==='light'||t==='dark')d.dataset.theme=t;if(s.getItem('app-rail-expanded-v2')==='true')d.style.setProperty('--app-sidebar-width','var(--app-sidebar-width-expanded)')}catch(e){}</script>
    <link rel="stylesheet" href="/common/global.css" />
    <link rel="stylesheet" href="/common/components.css" />
    <script type="module" src="/navigation.js"></script>
    <script type="module" src="/common/features/app-header.js"></script>
    <script type="module" src="/common/pages/chat-context-page.js"></script>
  </head>
  <body>
    <app-header></app-header>
    <chat-context-page data-page>
      <!-- Secondary-rail placeholder. Reserves the module nav's slot before the
           component injects the real `<app-module-nav>`: the shell slot is keyed on
           this class at first paint (styles/page-layout.css) and it reserves the
           disclosure bar below 1024px (styles/not-defined.css). -->
      <div class="pre-modnav"></div>
      <!-- Title/sub, two setting rows, save bar. -->
      <div style="display:flex;flex-direction:column;gap:var(--s-8);margin-bottom:var(--s-24);">
        <div class="skel-card__line" style="height:28px;width:160px;"></div>
        <div class="skel-card__line" style="width:420px;max-width:60vw;"></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,380px);gap:var(--s-32);align-items:center;padding:var(--s-16) 0;border-top:1px solid var(--color-border);">
        <div style="display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:140px;"></div><div class="skel-card__line" style="width:260px;"></div></div>
        <div class="skel-block" style="height:40px;border-radius:var(--r-8);"></div>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,380px);gap:var(--s-32);align-items:center;padding:var(--s-16) 0;border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border);">
        <div style="display:flex;flex-direction:column;gap:var(--s-8);"><div class="skel-card__line" style="width:160px;"></div><div class="skel-card__line" style="width:240px;"></div></div>
        <div class="skel-block" style="height:40px;border-radius:var(--r-8);"></div>
      </div>
    </chat-context-page>
  </body>
</html>
